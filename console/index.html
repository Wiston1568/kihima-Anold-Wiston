<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMAND_CONSOLE // WISTON_CODESPACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-red: #ff1744;
            --accent-orchid: #bc13fe;
            --glass-bg: rgba(13, 17, 23, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #05070a;
            color: #f0f6fc;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .main-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../Pictures/background.png') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .logo-container {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 100;
        }

        .logo-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 12px;
        }

        .sidebar-glass {
            position: fixed;
            top: 30px;
            right: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            width: 340px;
            border-radius: 40px;
            padding: 45px 35px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            z-index: 100;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            color: var(--accent-orchid);
            transform: translateX(-8px);
        }

        .arrow-box {
            background: var(--accent-red);
            color: #000;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: bold;
        }

        #content-bay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 75%;
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            display: none;
            z-index: 200;
            padding: 50px;
            box-shadow: 0 0 150px rgba(0,0,0,0.9);
        }

        .hero-text {
            text-align: center;
            pointer-events: none;
        }

        .hero-title {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 0.9;
        }

        .terminal-line {
            margin-bottom: 6px;
        }

        .terminal-info {
            color: #58a6ff;
        }

        .terminal-warn {
            color: var(--accent-red);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 45px;
                line-height: 1.1;
            }

            .logo-container {
                top: 25px;
                left: 25px;
            }

            .logo-img {
                width: 50px;
                height: 50px;
            }

            .sidebar-glass {
                top: auto;
                bottom: 20px;
                right: 15px;
                left: 15px;
                width: auto;
                padding: 10px 15px;
                border-radius: 25px;
            }

            .menu-list {
                display: flex;
                width: 100%;
                justify-content: space-around;
                align-items: center;
            }

            .menu-item {
                border-bottom: none;
                padding: 8px;
                flex-direction: column;
                text-align: center;
            }

            .menu-item span.text-xl {
                font-size: 10px !important;
                margin: 0;
                letter-spacing: 0;
            }

            .menu-item .arrow-box,
            .menu-item .mr-6,
            .sidebar-glass .mt-10 {
                display: none;
            }

            #content-bay {
                width: 92%;
                height: 85%;
                padding: 25px;
                top: 48%;
            }
        }
    </style>
</head>
<body>

    <div class="main-bg"></div>

    <div class="logo-container">
        <img src="../Pictures/logo.jpg" alt="Logo" class="logo-img">
    </div>

    <div class="hero-text absolute inset-0 flex flex-col items-center justify-center p-4">
        <p class="text-[10px] md:text-xs tracking-[0.5em] uppercase opacity-40 mb-3">
            Codespace_Active_Node
        </p>

        <h1 class="hero-title">
            E DEY<br class="md:hidden"> HAPPEN
        </h1>

        <div class="mt-8 flex items-center justify-center gap-4">
            <div class="w-2 h-2 bg-[#ff1744] rounded-full animate-ping"></div>
            <span class="text-[10px] font-bold tracking-[0.2em] uppercase text-[#ff1744]">
                System Live
            </span>
        </div>
    </div>

    <div class="sidebar-glass">
        <div class="menu-list">
            <div class="menu-item" onclick="openBay('CORE_SYSTEM')">
                <span class="mr-6 text-[10px] opacity-30">01</span>
                <span class="text-xl font-bold flex-grow tracking-tight">CORE</span>
                <div class="arrow-box">❯</div>
            </div>

            <div class="menu-item" onclick="openBay('GARDEN_MONITOR')">
                <span class="mr-6 text-[10px] opacity-30">02</span>
                <span class="text-xl font-bold flex-grow tracking-tight">GARDEN</span>
                <div class="arrow-box">❯</div>
            </div>

            <div class="menu-item" onclick="openBay('FINANCIAL_GRID')">
                <span class="mr-6 text-[10px] opacity-30">03</span>
                <span class="text-xl font-bold flex-grow tracking-tight">FINANCE</span>
                <div class="arrow-box">❯</div>
            </div>

            <div class="menu-item" onclick="openBay('LIVE_TERMINAL')">
                <span class="mr-6 text-[10px] opacity-30">04</span>
                <span class="text-xl font-bold flex-grow tracking-tight">LIVE</span>
                <div class="arrow-box">❯</div>
            </div>

            <div class="menu-item" onclick="openBay('SECURITY_VAULT')">
                <span class="mr-6 text-[10px] opacity-30">05</span>
                <span class="text-xl font-bold flex-grow tracking-tight">VAULT</span>
                <div class="arrow-box">❯</div>
            </div>
        </div>

        <div class="mt-10 text-[9px] opacity-30 tracking-[0.3em] uppercase">
            <p>© 2026 Anold Wiston</p>
        </div>
    </div>

    <div id="content-bay">
        <div class="flex justify-between items-center mb-8 md:mb-12">
            <h2 id="bay-title" class="text-3xl md:text-5xl font-black italic tracking-tighter uppercase text-[#bc13fe]"></h2>
            <button onclick="closeBay()" class="text-2xl md:text-3xl hover:text-[#ff1744] transition-transform hover:scale-110">
                ✕
            </button>
        </div>

        <div id="bay-body" class="h-[80%] overflow-y-auto"></div>
    </div>

    <script>
        const API_BASE = 'https://kihima-backend.onrender.com/api/v1';

        let statsData = {
            appsCount: 12,
            dailyRev: 15420,
            activeUsersCount: 91
        };

        let appDataStore = [
            {
                appId: 'APP-001',
                name: 'Main Client',
                version: '2.3.1',
                killSwitch: false,
                paymentsEnabled: true
            },
            {
                appId: 'APP-002',
                name: 'Beta Dashboard',
                version: '1.9.8',
                killSwitch: true,
                paymentsEnabled: false
            }
        ];

        let userDataStore = [
            {
                phoneNumber: '+254700111222',
                hwid: 'HWID-1001',
                isBanned: false
            },
            {
                phoneNumber: '+254700333444',
                hwid: 'HWID-1002',
                isBanned: true
            }
        ];

        let logs = [
            '> NODE_ACTIVE: Wiston Codespace Initialized',
            '> API_LAYER: Connected',
            '> SYSTEM_BOOT: All systems nominal'
        ];

        function openBay(type) {
            const bay = document.getElementById('content-bay');
            const title = document.getElementById('bay-title');
            const body = document.getElementById('bay-body');

            bay.style.display = 'block';
            title.innerText = type.replaceAll('_', ' ');

            if (type === 'CORE_SYSTEM') {
                body.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 h-[80%] overflow-y-auto';

                body.innerHTML = `
                    ${appDataStore.map(app => `
                        <div class="p-6 bg-white/5 border border-white/10 rounded-2xl">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-xl font-bold">${app.name}</h3>
                                    <p class="text-xs opacity-40">${app.appId}</p>
                                </div>

                                <span class="${app.killSwitch ? 'text-red-500' : 'text-green-400'} text-xs font-bold">
                                    ${app.killSwitch ? 'OFFLINE' : 'ONLINE'}
                                </span>
                            </div>

                            <div class="space-y-2 text-sm opacity-70">
                                <p>Version: ${app.version}</p>
                                <p>Payments: ${app.paymentsEnabled ? 'Enabled' : 'Disabled'}</p>
                            </div>

                            <div class="flex gap-3 mt-6">
                                <button class="px-4 py-2 rounded-xl bg-[#bc13fe] text-xs font-bold">
                                    NEXUS
                                </button>

                                <button class="px-4 py-2 rounded-xl bg-[#ff1744] text-xs font-bold">
                                    BAY
                                </button>
                            </div>
                        </div>
                    `).join('')}
                `;
            }

            else if (type === 'GARDEN_MONITOR') {
                body.className = 'space-y-6 h-[80%] overflow-y-auto';

                body.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input placeholder="PHONE" class="bg-black/30 border border-white/10 p-3 rounded-xl">
                        <input placeholder="EMAIL" class="bg-black/30 border border-white/10 p-3 rounded-xl">
                        <input placeholder="HWID" class="bg-black/30 border border-white/10 p-3 rounded-xl">

                        <button class="bg-[#bc13fe] rounded-xl font-bold text-xs">
                            GRANT ACCESS
                        </button>
                    </div>

                    <div class="space-y-4">
                        ${userDataStore.map(user => `
                            <div class="p-4 bg-white/5 border border-white/10 rounded-2xl flex justify-between items-center">
                                <div>
                                    <h4 class="font-bold">${user.phoneNumber}</h4>
                                    <p class="text-xs opacity-40">${user.hwid}</p>
                                </div>

                                <div class="flex gap-3">
                                    <button class="px-4 py-2 rounded-xl bg-[#bc13fe] text-xs font-bold">
                                        OPEN
                                    </button>

                                    <button class="px-4 py-2 rounded-xl bg-red-500/20 text-red-400 text-xs font-bold">
                                        ${user.isBanned ? 'RESTORE' : 'BAN'}
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            else if (type === 'FINANCIAL_GRID') {
                body.className = 'grid grid-cols-1 md:grid-cols-3 gap-6 h-[80%] overflow-y-auto';

                body.innerHTML = `
                    <div class="p-6 rounded-2xl bg-white/5 border border-white/10">
                        <p class="text-xs opacity-40">Today's Revenue</p>
                        <h2 class="text-4xl font-black text-[#bc13fe]">
                            KES ${statsData.dailyRev}
                        </h2>
                    </div>

                    <div class="p-6 rounded-2xl bg-white/5 border border-white/10">
                        <p class="text-xs opacity-40">Active Subs</p>
                        <h2 class="text-4xl font-black">
                            ${statsData.activeUsersCount}
                        </h2>
                    </div>

                    <div class="p-6 rounded-2xl bg-white/5 border border-white/10">
                        <p class="text-xs opacity-40">Projected Monthly</p>
                        <h2 class="text-4xl font-black text-green-400">
                            KES ${statsData.dailyRev * 30}
                        </h2>
                    </div>
                `;
            }

            else if (type === 'LIVE_TERMINAL') {
                body.className = 'space-y-4 h-[80%] overflow-y-auto';

                body.innerHTML = `
                    <div class="bg-black/40 rounded-2xl border border-white/10 p-4 h-full overflow-y-auto text-sm text-green-400">
                        ${logs.map(log => `<p class="terminal-line">${log}</p>`).join('')}
                    </div>
                `;
            }

            else if (type === 'SECURITY_VAULT') {
                body.className = 'grid grid-cols-1 md:grid-cols-2 gap-6 h-[80%] overflow-y-auto';

                body.innerHTML = `
                    <div class="p-6 bg-white/5 border border-white/10 rounded-2xl">
                        <p class="text-xs uppercase opacity-40 mb-4">Master PIN</p>

                        <input type="password" maxlength="4"
                            class="w-full bg-black/30 border border-white/10 p-4 rounded-xl mb-4">

                        <button class="w-full bg-[#bc13fe] py-4 rounded-xl font-bold text-xs">
                            UPDATE PIN
                        </button>
                    </div>

                    <div class="p-6 bg-white/5 border border-red-500/20 rounded-2xl">
                        <p class="text-xs uppercase text-red-400 mb-4">
                            Lockdown Protocol
                        </p>

                        <button class="w-full border border-red-500 text-red-500 py-4 rounded-xl font-bold text-xs mb-4">
                            GLOBAL LOCKDOWN
                        </button>

                        <button class="w-full border border-green-500 text-green-500 py-4 rounded-xl font-bold text-xs">
                            TOGGLE PAYMENTS
                        </button>
                    </div>
                `;
            }
        }

        function closeBay() {
            document.getElementById('content-bay').style.display = 'none';
        }
    </script>
</body>
</html>
